[package]
name = "mini-sap-desktop"
version = "0.1.0"
description = "A Tauri application"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-sql = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
